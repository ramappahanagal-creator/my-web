<script>
document.addEventListener("DOMContentLoaded", () => {
  // Background Slideshow (1.jpg to 57.jpg) - 3 seconds per image
  const container = document.getElementById("slideshowContainer");
  const total = 57;

  if (!container) return;

  for (let i = 1; i <= total; i++) {
    const imgPath = `${i}.jpg`;   // same folder: 1.jpg ... 57.jpg

    // preload
    const pre = new Image();
    pre.src = imgPath;

    const div = document.createElement("div");
    div.className = i === 1 ? "bg-slide active" : "bg-slide";
    div.style.backgroundImage = `url('${imgPath}')`;
    container.appendChild(div);
  }

  const slides = container.querySelectorAll(".bg-slide");
  let currentSlide = 0;

  function nextSlide() {
    slides[currentSlide].classList.remove("active");
    currentSlide = (currentSlide + 1) % slides.length;
    slides[currentSlide].classList.add("active");
  }

  setInterval(nextSlide, 3000);

  // Active nav link on scroll (same as your existing)
  const sections = document.querySelectorAll("section");
  const navLinks = document.querySelectorAll("nav ul li a");

  window.addEventListener("scroll", () => {
    let current = "";
    sections.forEach(section => {
      const sectionTop = section.offsetTop;
      if (window.pageYOffset >= sectionTop - 150) {
        current = section.getAttribute("id");
      }
    });

    navLinks.forEach(link => {
      link.classList.remove("active");
      if (link.getAttribute("href").includes(current)) {
        link.classList.add("active");
      }
    });
  });
});
</script>
